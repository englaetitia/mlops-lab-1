[project]
name = "mlops-lab-1"
version = "0.1.0"
description = "MLOps labs - Food-11 classifier"
readme = "README.md"
authors = [
    { name = "GitHub User", email = "you@example.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "mlflow>=3.16.0",
    "pillow>=12.3.0",
    "scikit-learn>=1.7.2",
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
mlops-lab-1 = "mlops_lab_1:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu",   marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu",   marker = "sys_platform != 'win32'" },
]

[tool.pytest.ini_options]
# lets the tests do "from src.food11... import ..."
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff.lint]
# pyflakes (F), basic pycodestyle errors (E4/E7/E9), import order (I), bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "B"]
# FastAPI's normal way to declare an upload is `file: UploadFile = File(...)`
ignore = ["B008"]

[tool.ruff.lint.isort]
# the mlflow/ folder (lab 4 Dockerfile) makes ruff think `mlflow` is our own package
known-third-party = ["mlflow"]
